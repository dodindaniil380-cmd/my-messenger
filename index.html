<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Messenger Pro</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f172a;
  color: white;
}

/* FIX MOBILE */
html, body {
  height: 100%;
  overflow: hidden;
}

input, textarea {
  font-size: 16px;
}

* {
  -webkit-tap-highlight-color: transparent;
}

/* LAYOUT */
.container {
  display: flex;
  height: 100vh;
}

/* SIDEBAR */
.sidebar {
  width: 320px;
  background: #1e293b;
  padding: 10px;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}

.chat-item {
  padding: 12px;
  background: #334155;
  margin-top: 5px;
  border-radius: 10px;
  cursor: pointer;
}

/* CHAT */
.chat {
  flex: 1;
  display: flex;
  flex-direction: column;
}

.chat-header {
  padding: 15px;
  background: #1e293b;
  font-weight: bold;
  display: flex;
}

.back-btn {
  display: none;
  margin-right: 10px;
  cursor: pointer;
}

#messages {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
}

.msg {
  padding: 10px;
  margin-top: 5px;
  border-radius: 12px;
  background: #334155;
  max-width: 70%;
}

.me {
  background: #2563eb;
  margin-left: auto;
}

.chat-input {
  display: none;
  padding: 10px;
  background: #1e293b;
  width: 100%;
}

button {
  padding: 10px;
  border-radius: 10px;
  border: none;
  background: #3b82f6;
  color: white;
}

input {
  padding: 10px;
  border-radius: 10px;
  border: none;
  width: 100%;
  margin-top: 5px;
}

/* AUTH */
#authScreen {
  display: flex;
  height: 100vh;
  justify-content: center;
  align-items: center;
}

.card {
  background: #1e293b;
  padding: 20px;
  border-radius: 12px;
  width: 300px;
}

/* MODAL */
.modal {
  position: fixed;
  top:0; left:0;
  width:100%; height:100%;
  background: rgba(0,0,0,0.7);
  display:none;
  justify-content:center;
  align-items:center;
}

.modal-content {
  background:#1e293b;
  padding:20px;
  border-radius:12px;
  width:300px;
}

/* MOBILE */
@media (max-width: 768px) {

  body {
    position: fixed;
    width: 100%;
    height: 100%;
  }

  .sidebar {
    width: 100%;
  }

  .chat {
    position: absolute;
    width: 100%;
    height: 100%;
    left: 100%;
    background: #0f172a;
    transition: 0.3s;
  }

  .chat.active {
    left: 0;
  }

  .back-btn {
    display: block;
  }

  #messages {
    padding-bottom: 80px;
  }

  .chat-input {
    position: fixed;
    bottom: 0;
    width: 100%;
  }
}
</style>
</head>

<body>

<div id="authScreen">
  <div class="card">
    <h2>Вход</h2>
    <input id="loginEmail" placeholder="Email">
    <input id="loginPass" type="password">
    <button onclick="login()">Войти</button>
    <button onclick="openRegister()">Регистрация</button>
  </div>
</div>

<div id="registerModal" class="modal">
  <div class="modal-content">
    <input id="regUsername" placeholder="username">
    <input id="regEmail" placeholder="Email">
    <input id="regPass" type="password">
    <input id="regPass2" type="password">
    <button onclick="register()">Создать</button>
  </div>
</div>

<div id="appScreen" class="container" style="display:none">

  <div class="sidebar">
    <button onclick="logout()">Выйти</button>
    <input id="search" placeholder="@username" oninput="searchUsers()">
    <div id="users"></div>
    <h4>Чаты</h4>
    <div id="chats"></div>
  </div>

  <div id="chatScreen" class="chat">
    <div class="chat-header">
      <span class="back-btn" onclick="closeChat()">⬅</span>
      <span id="chatHeader">Выберите чат</span>
    </div>

    <div id="messages"></div>

    <div id="chatInput" class="chat-input">
      <input id="messageInput" placeholder="Сообщение">
      <button onclick="sendMessage()">Отправить</button>
    </div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut }
from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, doc, setDoc, getDoc, onSnapshot, query, orderBy }
from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyBLBAeIPj7DTcoV0Ns3OGjHl2XHoid-0UA",
  authDomain: "my-messenger-53823.firebaseapp.com",
  projectId: "my-messenger-53823"
});

const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let currentChatId = null;

const authScreen = document.getElementById("authScreen");
const appScreen = document.getElementById("appScreen");
const chatInput = document.getElementById("chatInput");
const chatHeader = document.getElementById("chatHeader");
const chatScreen = document.getElementById("chatScreen");

window.login = () => signInWithEmailAndPassword(auth, loginEmail.value, loginPass.value);
window.logout = () => signOut(auth);

window.openRegister = () => registerModal.style.display = "flex";

window.register = async () => {
  if (regPass.value !== regPass2.value) return alert("Пароли не совпадают");

  const user = await createUserWithEmailAndPassword(auth, regEmail.value, regPass.value);

  await setDoc(doc(db, "users", user.user.uid), {
    username: regUsername.value.toLowerCase(),
    uid: user.user.uid
  });

  registerModal.style.display = "none";
};

onAuthStateChanged(auth, (user) => {
  if (user) {
    currentUser = user;
    authScreen.style.display = "none";
    appScreen.style.display = "flex";
    listenChats();
  } else {
    authScreen.style.display = "flex";
    appScreen.style.display = "none";
  }
});

window.searchUsers = async () => {
  const snap = await getDocs(collection(db, "users"));
  users.innerHTML = "";

  snap.forEach(docSnap => {
    const u = docSnap.data();
    if (u.uid === currentUser.uid) return;
    if (!u.username.includes(search.value.toLowerCase())) return;

    const div = document.createElement("div");
    div.className = "chat-item";
    div.innerText = "@" + u.username;

    div.onclick = () => createChat(u);
    users.appendChild(div);
  });
};

async function createChat(user) {
  const chatId = [currentUser.uid, user.uid].sort().join("_");

  await setDoc(doc(db, "chats", chatId), {
    users: [currentUser.uid, user.uid]
  });

  openChat(chatId);
}

function listenChats() {
  onSnapshot(collection(db, "chats"), async snap => {
    chats.innerHTML = "";

    for (const docSnap of snap.docs) {
      const data = docSnap.data();
      if (!data.users.includes(currentUser.uid)) continue;

      const otherId = data.users.find(u => u !== currentUser.uid);
      const userDoc = await getDoc(doc(db, "users", otherId));
      const username = userDoc.data()?.username || "user";

      const div = document.createElement("div");
      div.className = "chat-item";
      div.innerText = "@" + username;

      div.onclick = () => openChat(docSnap.id, username);
      chats.appendChild(div);
    }
  });
}

function openChat(chatId, name="Чат") {
  currentChatId = chatId;
  chatHeader.innerText = name;
  chatInput.style.display = "block";
  chatScreen.classList.add("active");

  const q = query(collection(db, "chats", chatId, "messages"), orderBy("time"));

  onSnapshot(q, snap => {
    messages.innerHTML = "";

    snap.forEach(doc => {
      const msg = doc.data();
      const div = document.createElement("div");

      div.className = "msg";
      if (msg.uid === currentUser.uid) div.classList.add("me");

      div.innerText = msg.text;
      messages.appendChild(div);
    });
  });
}

window.closeChat = () => {
  chatScreen.classList.remove("active");
  currentChatId = null;
  chatInput.style.display = "none";
};

window.sendMessage = async () => {
  if (!currentChatId) return;

  await addDoc(collection(db, "chats", currentChatId, "messages"), {
    text: messageInput.value,
    uid: currentUser.uid,
    time: Date.now()
  });

  messageInput.value = "";
};
</script>

</body>
</html>ы
