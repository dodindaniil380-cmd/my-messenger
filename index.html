<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Messenger PRO MOBILE FIX</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <link rel="icon" href="data:,">

    <style>
        html, body {
          height: 100%;
          margin: 0;
          font-family: Arial;
          background: #0f172a;
          color: white;
          overflow: hidden;
        }

        .container {
          display: flex;
          height: 100dvh;
        }

        /* SIDEBAR */
        .sidebar {
          width: 320px;
          background: #1e293b;
          display: flex;
          flex-direction: column;
        }

        .top { padding: 10px; }

        .chat-item {
          padding: 12px;
          border-bottom: 1px solid #334155;
          cursor: pointer;
        }
        .chat-item:hover { background: #334155; }

        .last-msg {
          font-size: 12px;
          color: #94a3b8;
        }

        /* CHAT */
        .chat {
          flex: 1;
          display: flex;
          flex-direction: column;
        }

        .chat-header {
          padding: 15px;
          background: #1e293b;
          font-weight: bold;
        }

        #messages {
          flex: 1;
          overflow-y: auto;
          padding: 10px;
          -webkit-overflow-scrolling: touch;
        }

        .msg {
          display: flex;
          flex-direction: column;
          margin-top: 8px;
          max-width: 70%;
        }

        .me { margin-left: auto; }

        .msg-bubble {
          padding: 10px;
          border-radius: 12px;
        }

        .me .msg-bubble { background: #2563eb; }
        .other .msg-bubble { background: #334155; }

        .msg img {
          max-width: 220px;
          border-radius: 12px;
        }

        /* INPUT */
        .chat-input {
          display: none;
          padding: 10px;
          background: #1e293b;
          position: sticky;
          bottom: 0;
        }

        .preview {
          max-width: 120px;
          border-radius: 10px;
          margin-top: 5px;
        }

        input {
          padding: 10px;
          border-radius: 10px;
          border: none;
          width: 100%;
          margin-top: 5px;
          font-size: 16px; /* фикс зума */
        }

        button {
          padding: 10px;
          border: none;
          border-radius: 10px;
          background: #3b82f6;
          color: white;
          margin-top: 5px;
          cursor: pointer;
          touch-action: manipulation;
        }

        /* MOBILE */
        @media (max-width:768px){
        .container {
    flex-direction: column;
    width: 100%;
  }

  .sidebar {
    width: 100%;
    height: 100%;
  }

  .chat {
    position: fixed;
    top: 0;
    left: 100%;
    width: 100%;
    height: 100dvh;
    background: #0f172a;
    z-index: 10;
    transition: 0.3s;
  }

  .chat.active {
    left: 0;
  }

}
    </style>
</head>

<body>

<div id="authScreen">
    <input id="loginEmail" placeholder="Email">
    <input id="loginPass" type="password" placeholder="Password"
           onkeypress="if(event.key==='Enter') login()">
    <button onclick="login()">Войти</button>
    <button onclick="register()">Регистрация</button>
</div>

<div id="appScreen" class="container" style="display:none">

    <div class="sidebar">
        <div class="top">
            <button onclick="logout()">Выйти</button>
            <input id="search" placeholder="Поиск" oninput="searchUsers()">
        </div>

        <div id="users"></div>
        <div id="chats"></div>
    </div>

    <div id="chatScreen" class="chat">
        <div class="chat-header" id="chatHeader">Чат</div>

        <div id="messages"></div>

        <div id="chatInput" class="chat-input">
            <input id="messageInput" placeholder="Сообщение"
                   onkeypress="if(event.key==='Enter') sendMessage()">

            <input type="file" id="fileInput" onchange="previewImage()">
            <img id="preview" class="preview" style="display:none">

            <button onclick="sendMessage()">Отправить</button>
        </div>
    </div>

</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut }
    from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";

    import { getFirestore, collection, addDoc, getDocs, doc, setDoc, getDoc, onSnapshot, query, orderBy, updateDoc }
    from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

    /* CONFIG */
    const app = initializeApp({
      apiKey: "AIzaSyBLBAeIPj7DTcoV0Ns3OGjHl2XHoid-0UA",
      authDomain: "my-messenger-53823.firebaseapp.com",
      projectId: "my-messenger-53823",
      messagingSenderId: "953050870993",
      appId: "1:953050870993:web:98b6a4080f5a6a142f41f0"
    });

    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser;
    let currentChatId;

    /* AUTH */
    window.login = async () => {
      try {
        await signInWithEmailAndPassword(auth, loginEmail.value, loginPass.value);
      } catch (e) {
        alert(e.message);
      }
    };

    window.register = async () => {
      try {
        const user = await createUserWithEmailAndPassword(auth, loginEmail.value, loginPass.value);

        await setDoc(doc(db, "users", user.user.uid), {
          username: loginEmail.value.split("@")[0],
          online: true
        });

      } catch (e) {
        alert(e.message);
      }
    };

    window.logout = () => signOut(auth);

    onAuthStateChanged(auth, async user => {
      if (user) {
        currentUser = user;
        authScreen.style.display="none";
        appScreen.style.display="flex";

        const ref = doc(db,"users",user.uid);
        const snap = await getDoc(ref);

        if(snap.exists()){
          await updateDoc(ref,{online:true});
        } else {
          await setDoc(ref,{
            username: user.email.split("@")[0],
            online:true
          });
        }

        listenChats();
      } else {
        authScreen.style.display="block";
        appScreen.style.display="none";
      }
    });

    /* PREVIEW */
    window.previewImage = () => {
      const file = fileInput.files[0];
      if(!file) return;

      const reader = new FileReader();
      reader.onload = e => {
        preview.src = e.target.result;
        preview.style.display = "block";
      };
      reader.readAsDataURL(file);
    };

    /* SEARCH */
    window.searchUsers = async () => {
      const snap = await getDocs(collection(db,"users"));
      users.innerHTML="";

      snap.forEach(d=>{
        const u=d.data();
        if(u.username.includes(search.value)){
          const div=document.createElement("div");
          div.className="chat-item";
          div.innerText=u.username;
          div.onclick=()=>createChat(u,d.id);
          users.appendChild(div);
        }
      });
    };

    /* CREATE CHAT */
    async function createChat(user,id){
      const chatId=[currentUser.uid,id].sort().join("_");
      await setDoc(doc(db,"chats",chatId),{users:[currentUser.uid,id]});
      openChat(chatId,user.username);
    }

    /* CHATS */
    function listenChats(){
      onSnapshot(collection(db,"chats"), async snap=>{
        chats.innerHTML="";

        for(const d of snap.docs){
          const data=d.data();
          if(!data.users.includes(currentUser.uid)) continue;

          const other=data.users.find(u=>u!==currentUser.uid);
          const userDoc=await getDoc(doc(db,"users",other));

          const lastMsgSnap = await getDocs(query(
            collection(db,"chats",d.id,"messages"),
            orderBy("time","desc")
          ));

          let last="";
          if(!lastMsgSnap.empty){
            const m=lastMsgSnap.docs[0].data();
            last = m.text || "📸 Фото";
          }

          const div=document.createElement("div");
          div.className="chat-item";

          div.innerHTML=`
            <b>${userDoc.data().username}</b>
            <div class="last-msg">${last}</div>
          `;

          div.onclick=()=>openChat(d.id,userDoc.data().username);
          chats.appendChild(div);
        }
      });
    }

    /* OPEN CHAT */
    function openChat(id,name){
      currentChatId=id;
      chatHeader.innerText=name;
      chatInput.style.display="block";
      chatScreen.classList.add("active");

      const q=query(collection(db,"chats",id,"messages"),orderBy("time"));

      onSnapshot(q,snap=>{
        messages.innerHTML="";

        snap.forEach(d=>{
          const msg=d.data();

          const div=document.createElement("div");
          div.className="msg";
          div.classList.add(msg.uid===currentUser.uid?"me":"other");

          if(msg.img){
            div.innerHTML=`<img src="${msg.img}">`;
          } else {
            div.innerHTML=`<div class="msg-bubble">${msg.text}</div>`;
          }

          messages.appendChild(div);
        });

        messages.scrollTop=messages.scrollHeight;
      });
    }

    /* COMPRESS */
    function compressImage(base64, quality=0.6){
      return new Promise(resolve=>{
        const img=new Image();
        img.src=base64;

        img.onload=()=>{
          const canvas=document.createElement("canvas");
          canvas.width=img.width;
          canvas.height=img.height;

          const ctx=canvas.getContext("2d");
          ctx.drawImage(img,0,0);

          resolve(canvas.toDataURL("image/jpeg", quality));
        };
      });
    }

    /* SEND */
    window.sendMessage = async ()=>{
      if(!currentChatId) return;

      if(fileInput.files[0]){
        const reader=new FileReader();

        reader.onload=async e=>{
          let base64=e.target.result;
          base64 = await compressImage(base64);

          await addDoc(collection(db,"chats",currentChatId,"messages"),{
            img: base64,
            uid: currentUser.uid,
            time: Date.now()
          });
        };

        reader.readAsDataURL(fileInput.files[0]);
        preview.style.display="none";
        fileInput.value="";
        return;
      }

      if(!messageInput.value) return;

      await addDoc(collection(db,"chats",currentChatId,"messages"),{
        text:messageInput.value,
        uid:currentUser.uid,
        time:Date.now()
      });

      messageInput.value="";
    };
</script>

</body>
</html>
